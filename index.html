<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Pengajuan Jadwal | NAOKI ARVINO</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-[#F4F9F8] text-slate-800 min-h-screen flex items-center justify-center p-4 sm:p-6">

    <div class="w-full max-w-lg bg-white rounded-3xl shadow-xl shadow-teal-900/5 border border-teal-50 overflow-hidden">
        <!-- Header / Banner -->
        <div class="bg-gradient-to-r from-teal-600 to-teal-700 p-8 text-white text-center relative">
            <div class="absolute top-0 right-0 w-32 h-32 bg-white/10 rounded-full blur-2xl -mr-10 -mt-10 pointer-events-none"></div>
            <span class="inline-block px-3 py-1 bg-white/20 text-xs font-medium rounded-full tracking-wider mb-3 backdrop-blur-sm">
                PORTAL JADWAL & KONFIRMASI
            </span>
            <h1 class="text-2xl sm:text-3xl font-bold tracking-tight">Atur Jadwal Anda</h1>
            <p class="text-teal-100 text-sm mt-2 font-light">Silakan lengkapi data di bawah untuk mengirimkan jadwal langsung via WhatsApp.</p>
        </div>

        <!-- Form Body -->
        <div class="p-6 sm:p-8 space-y-6">
            <form id="scheduleForm" onsubmit="handleSendWhatsApp(event)" class="space-y-5">
                
                <!-- Nama Lengkap -->
                <div class="space-y-1.5">
                    <label for="nama" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider">Nama Lengkap</label>
                    <input type="text" id="nama" required 
                        placeholder="Contoh: Budi Santoso"
                        class="w-full px-4 py-3 bg-[#F9FBFA] border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all text-sm">
                </div>

                <!-- Keperluan / Layanan -->
                <div class="space-y-1.5">
                    <label for="keperluan" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider">Keperluan / Layanan</label>
                    <select id="keperluan" required
                        class="w-full px-4 py-3 bg-[#F9FBFA] border border-slate-200 rounded-xl text-slate-800 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all text-sm cursor-pointer">
                        <option value="" disabled selected>Pilih Keperluan</option>
                        <option value="Sesi Foto Prewedding / Wedding">Sesi Foto Prewedding / Wedding</option>
                        <option value="Konsultasi & Diskusi Proyek">Konsultasi & Diskusi Proyek</option>
                        <option value="Interview / Wawancara">Interview / Wawancara</option>
                        <option value="Lainnya">Lainnya</option>
                    </select>
                </div>

                <!-- Grid Tanggal & Jam -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- Tanggal -->
                    <div class="space-y-1.5">
                        <label for="tanggal" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider">Tanggal</label>
                        <input type="date" id="tanggal" required 
                            class="w-full px-4 py-3 bg-[#F9FBFA] border border-slate-200 rounded-xl text-slate-800 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all text-sm">
                    </div>
                    <!-- Jam -->
                    <div class="space-y-1.5">
                        <label for="jam" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider">Waktu / Jam</label>
                        <input type="time" id="jam" required 
                            class="w-full px-4 py-3 bg-[#F9FBFA] border border-slate-200 rounded-xl text-slate-800 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all text-sm">
                    </div>
                </div>

                <!-- Catatan Tambahan -->
                <div class="space-y-1.5">
                    <label for="catatan" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider">Catatan Tambahan (Opsional)</label>
                    <textarea id="catatan" rows="3" 
                        placeholder="Tuliskan catatan atau detail tambahan jika ada..."
                        class="w-full px-4 py-3 bg-[#F9FBFA] border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all text-sm resize-none"></textarea>
                </div>

                <!-- Tombol Kirim -->
                <button type="submit" 
                    class="w-full py-3.5 px-6 bg-teal-600 hover:bg-teal-700 text-white font-medium rounded-xl shadow-lg shadow-teal-600/25 transition-all duration-200 flex items-center justify-center space-x-2 text-sm cursor-pointer">
                    <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                        <path d="M12.031 6.172c-3.181 0-5.767 2.586-5.767 5.766 0 1.016.269 1.968.736 2.793l-.784 2.868 2.946-.773c.792.433 1.716.685 2.669.685 3.181 0 5.767-2.587 5.767-5.766 0-3.181-2.586-5.779-5.763-5.779zm3.435 8.19c-.145.41-.84.77-1.163.82-.315.05-.718.093-1.157-.045-.268-.084-.613-.2-1.077-.4-1.892-.816-3.13-2.738-3.226-2.864-.096-.126-.77-1.025-.77-1.955 0-.93.483-1.388.655-1.577.174-.19.378-.238.504-.238.126 0 .252.001.362.008.116.007.272-.044.425.321.155.374.526 1.283.572 1.376.046.094.077.204.011.33-.065.127-.098.206-.193.318-.096.113-.203.252-.29.338-.097.095-.2.2-.086.398.114.197.505.833 1.083 1.349.744.664 1.371.87 1.567.967.196.097.311.082.426-.051.116-.134.498-.582.631-.782.133-.199.266-.167.447-.101.182.066 1.153.544 1.351.644.198.1.33.15.378.234.048.084.048.487-.097.897z"/>
                    </svg>
                    <span>Kirim Jadwal via WhatsApp</span>
                </button>
            </form>
        </div>

        <!-- Footer -->
        <div class="bg-[#F4F9F8] px-6 py-4 border-t border-teal-50 text-center">
            <p class="text-xs text-slate-400">© 2026 • Secure Schedule Gateway</p>
        </div>
    </div>

    <script>
        function handleSendWhatsApp(event) {
            // Mencegah halaman melakukan reload default form
            event.preventDefault();

            // Ambil nilai dari setiap input form
            const nama = document.getElementById('nama').value.trim();
            const keperluan = document.getElementById('keperluan').value;
            const tanggal = document.getElementById('tanggal').value;
            const jam = document.getElementById('jam').value;
            const catatan = document.getElementById('catatan').value.trim();

            // Format nomor WhatsApp tujuan (Tanpa +, tanpa 0 di depan, awali dengan 62)
            const nomorWa = "6282116046404";

            // Susun format teks pesan dengan rapi
            let pesan = `Halo, saya ingin mengajukan jadwal dengan detail berikut:\n\n` +
                        `• *Nama*: ${nama}\n` +
                        `• *Keperluan*: ${keperluan}\n` +
                        `• *Tanggal*: ${tanggal}\n` +
                        `• *Waktu*: ${jam} WIB`;

            if (catatan) {
                pesan += `\n• *Catatan*: ${catatan}`;
            }

            pesan += `\n\nMohon konfirmasinya. Terima kasih!`;

            // Buat URL API WhatsApp dengan fungsi encodeURIComponent agar spasi dan enter aman
            const urlWa = `https://wa.me/${nomorWa}?text=${encodeURIComponent(pesan)}`;

            // Buka link WhatsApp di tab/aplikasi baru
            window.open(urlWa, '_blank');
        }
    </script>
</body>
</html>
